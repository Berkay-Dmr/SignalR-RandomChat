<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastgele Sohbet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           KÖK DEĞİŞKENLER — Sıcak, samimi palet
           ===================================================== */
        :root {
            --peach: #FFE3D3;
            --lavender: #EDE1F3;
            --card: #FFFCF8;
            --ink: #4A3F44;
            --ink-soft: #8A7B82;
            --coral: #FF7B6B;
            --coral-deep: #F0553F;
            --teal: #4FBFAF;
            --bubble-them: #F3EEE6;
            --bubble-them-text: #4A3F44;
            --ring: rgba(255, 123, 107, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
        }

        html, body { height: 100%; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(150deg, var(--peach) 0%, var(--lavender) 55%, #E4E9FA 100%);
            color: var(--ink);
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        /* Yumuşak, süzülen ışık lekeleri — arka planda sakin bir atmosfer */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            z-index: 0;
            animation: drift 14s ease-in-out infinite alternate;
        }
        body::before {
            width: 360px; height: 360px;
            background: #FFC9B8;
            top: -60px; left: -80px;
        }
        body::after {
            width: 420px; height: 420px;
            background: #C9D6FA;
            bottom: -100px; right: -90px;
            animation-delay: -7s;
        }
        @keyframes drift {
            to { transform: translate(30px, 20px) scale(1.08); }
        }

        /* =====================================================
           ANA KART
           ===================================================== */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 28px;
            padding: 34px 30px 28px;
            box-shadow:
                0 2px 6px rgba(74, 63, 68, 0.06),
                0 20px 50px rgba(74, 63, 68, 0.16);
        }

        .screen { display: none; }
        .screen.active {
            display: block;
            animation: riseIn 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes riseIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           EŞLEŞME EKRANI
           ===================================================== */
        .hero {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        /* İki kabarcığın buluşması — imzamız: iki insanın rastgele bir araya gelişini simgeliyor */
        .hero-bubbles {
            position: relative;
            width: 120px;
            height: 76px;
        }
        .hero-bubbles .b1, .hero-bubbles .b2 {
            position: absolute;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(74, 63, 68, 0.15);
        }
        .hero-bubbles .b1 {
            width: 64px; height: 64px;
            left: 0; top: 6px;
            background: linear-gradient(145deg, var(--coral), var(--coral-deep));
            animation: bob 3s ease-in-out infinite;
        }
        .hero-bubbles .b2 {
            width: 54px; height: 54px;
            right: 0; top: 0;
            background: linear-gradient(145deg, #7BD6C4, var(--teal));
            animation: bob 3s ease-in-out infinite 1.2s;
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h2 {
            font-family: 'Quicksand', sans-serif;
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            color: var(--ink);
            margin-bottom: 8px;
        }

        #status-text {
            text-align: center;
            font-size: 14.5px;
            color: var(--ink-soft);
            min-height: 20px;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        /* =====================================================
           BUTONLAR
           ===================================================== */
        button {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
            font-size: 15.5px;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        button:active { transform: scale(0.97); }

        #match-btn {
            background: linear-gradient(135deg, var(--coral), var(--coral-deep));
            color: #fff;
            box-shadow: 0 10px 24px rgba(240, 85, 63, 0.35);
        }
        #match-btn:hover { box-shadow: 0 12px 28px rgba(240, 85, 63, 0.45); transform: translateY(-1px); }

        #cancel-btn {
            background: #F3EEE6;
            color: var(--ink-soft);
            box-shadow: none;
        }
        #cancel-btn:hover { background: #ece5da; }

        #leave-btn {
            width: auto;
            padding: 8px 16px;
            margin-bottom: 16px;
            font-size: 12.5px;
            background: transparent;
            color: var(--ink-soft);
            border: 1.5px solid #e7ded5;
        }
        #leave-btn:hover { background: #faf6f1; color: var(--coral-deep); border-color: var(--coral); }

        button:disabled {
            background: #EFE9E2 !important;
            color: #c3b9b0 !important;
            box-shadow: none !important;
            cursor: not-allowed;
        }

        #send-btn {
            width: auto;
            padding: 12px 20px;
            margin-left: 8px;
            background: linear-gradient(135deg, var(--coral), var(--coral-deep));
            color: #fff;
            box-shadow: 0 6px 16px rgba(240, 85, 63, 0.3);
        }
        #send-btn:hover { box-shadow: 0 8px 20px rgba(240, 85, 63, 0.4); }

        /* =====================================================
           SOHBET EKRANI
           ===================================================== */
        #chat-box {
            height: 380px;
            background: #FBF8F4;
            border-radius: 20px;
            margin-bottom: 14px;
            padding: 18px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; }
        #chat-box::-webkit-scrollbar-thumb { background: #e3d9cd; border-radius: 10px; }

        .message {
            position: relative;
            max-width: 78%;
            padding: 11px 16px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            border-radius: 18px;
            animation: pop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.9) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--coral), var(--coral-deep));
            color: #fff;
            border-bottom-right-radius: 5px;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bubble-them);
            color: var(--bubble-them-text);
            border-bottom-left-radius: 5px;
            padding-left: 42px;
        }
        /* Karşı taraf için küçük, sevimli bir avatar rozeti */
        .message.received::before {
            content: '🎭';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            background: linear-gradient(135deg, #7BD6C4, var(--teal));
            border-radius: 50%;
        }

        /* --- YAZIYOR GÖSTERGESİ: zıplayan üç nokta, gerçek bir mesaj kabarcığı gibi --- */
        #typing-indicator {
            display: none;
            align-self: flex-start;
            margin-bottom: 6px;
        }
        #typing-indicator .typing-bubble {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: var(--bubble-them);
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            width: fit-content;
        }
        #typing-indicator .typing-bubble span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink-soft);
            opacity: 0.5;
            animation: typingBounce 1.1s infinite ease-in-out;
        }
        #typing-indicator .typing-bubble span:nth-child(1) { animation-delay: 0s; }
        #typing-indicator .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
        #typing-indicator .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* =====================================================
           GİRDİ ALANI
           ===================================================== */
        .input-group {
            display: flex;
            align-items: center;
            background: #FBF8F4;
            padding: 5px;
            border-radius: 18px;
            border: 2px solid transparent;
            transition: border-color 0.2s ease;
        }
        .input-group:focus-within { border-color: var(--coral); }

        #message-input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: var(--ink);
            font-size: 14.5px;
            outline: none;
        }
        #message-input::placeholder { color: #b6aaa1; }
        #message-input:disabled { cursor: not-allowed; }

        @media (max-width: 480px) {
            .card { padding: 26px 20px 22px; border-radius: 22px; }
            #chat-box { height: 320px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Eşleşme Ekranı -->
        <div id="match-screen" class="screen active">
            <div class="hero">
                <div class="hero-bubbles">
                    <div class="b1">💬</div>
                    <div class="b2">✨</div>
                </div>
            </div>
            <h2>Rastgele Sohbet</h2>
            <p id="status-text">Yeni biriyle tanışmaya hazır mısın?</p>
            <button id="match-btn">Sohbete Başla</button>
            <button id="cancel-btn" style="display: none;">Aramayı Durdur</button>
        </div>

        <!-- Sohbet Ekranı -->
        <div id="chat-screen" class="screen">
            <button id="leave-btn">← Sohbetten Ayrıl</button>
            <div id="chat-box"></div>
            <div id="typing-indicator">
                <div class="typing-bubble"><span></span><span></span><span></span></div>
            </div>
            <div class="input-group">
                <input type="text" id="message-input" placeholder="Bir şeyler yaz..." disabled>
                <button id="send-btn" disabled>Gönder</button>
            </div>
        </div>
    </div>

    <!-- SignalR Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
